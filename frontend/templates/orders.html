{% extends "base.html" %}

{% block content %}
<div class="container py-4">
  
  <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
    <div>
      <h1 class="font-serif fw-bold h2 mb-1">My Orders & Tracking</h1>
      <span class="text-muted small">Real-time status updates and order archive</span>
    </div>
    <a href="/products" class="btn btn-sm btn-outline-dark rounded-pill px-3">Continue Shopping</a>
  </div>

  <div id="ordersContainer">
    <div class="text-center py-5">
      <div class="spinner-border text-dark"></div>
    </div>
  </div>

</div>
{% endblock %}

{% block extra_scripts %}
<script>
document.addEventListener('DOMContentLoaded', () => {
  loadOrders();
});

async function loadOrders() {
  const container = document.getElementById('ordersContainer');
  const user = getCurrentUser();

  if (!user) {
    container.innerHTML = `
      <div class="card p-5 rounded-3 text-center my-4" style="background: var(--color-surface-low); border: 1px solid var(--color-outline-subtle);">
        <div class="mb-3 text-secondary" style="font-size: 3rem;"><i class="bi bi-person-lock"></i></div>
        <h4 class="fw-bold mb-2 text-white">Sign in to View Your Orders</h4>
        <p class="text-secondary small mb-4">Please log in to track your current shipments and view your complete purchase history.</p>
        <div>
          <a href="/login" class="btn btn-stitch-primary px-4 py-3 fw-bold">Sign In Now</a>
        </div>
      </div>
    `;
    return;
  }

  try {
    const orders = await apiFetch('/orders');

    if (!orders || orders.length === 0) {
      container.innerHTML = `
        <div class="text-center py-5">
          <div class="mb-3 text-secondary" style="font-size: 3rem;"><i class="bi bi-box-seam"></i></div>
          <h4 class="fw-bold text-white">No orders placed yet</h4>
          <p class="text-secondary small">Your confirmed luxury purchases and delivery tracking will appear here.</p>
          <a href="/products" class="btn btn-stitch-primary px-4 py-3 mt-2">Explore Catalog</a>
        </div>
      `;
      return;
    }

    container.innerHTML = orders.map(order => {
      const isDelivered = order.status === 'Delivered';
      const isShipped = order.status === 'Shipped' || isDelivered;
      const isProcessing = order.status === 'Processing' || isShipped;
      const isConfirmed = true;

      return `
        <div class="card rounded-3 mb-4 overflow-hidden" style="background: var(--color-surface-low); border: 1px solid var(--color-outline-subtle);">
          <!-- Order Header Bar -->
          <div class="card-header border-bottom py-3 px-4 d-flex flex-wrap justify-content-between align-items-center gap-3" style="background: var(--color-surface-container);">
            <div class="d-flex align-items-center gap-3">
              <div>
                <span class="text-uppercase text-muted fw-bold" style="font-size: 0.7rem;">Order Placed</span>
                <div class="small fw-semibold">${new Date(order.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })}</div>
              </div>
              <div class="vr"></div>
              <div>
                <span class="text-uppercase text-muted fw-bold" style="font-size: 0.7rem;">Order Number</span>
                <div class="small fw-semibold font-monospace">${order.order_number}</div>
              </div>
              <div class="vr"></div>
              <div>
                <span class="text-uppercase text-muted fw-bold" style="font-size: 0.7rem;">Total</span>
                <div class="small fw-bold">₹${order.total_amount.toLocaleString()}</div>
              </div>
            </div>

            <div>
              <span class="badge ${order.status === 'Delivered' ? 'bg-success' : 'bg-dark'} rounded-pill px-3 py-2">
                ${order.status}
              </span>
            </div>
          </div>

          <!-- Order Body -->
          <div class="card-body p-4">
            <!-- Tracking Timeline -->
            <div class="order-tracking-steps my-2">
              <div class="tracking-step ${isConfirmed ? 'completed' : ''}">
                <div class="tracking-step-dot"><i class="bi bi-check-lg"></i></div>
                <div class="small fw-semibold">Confirmed</div>
              </div>
              <div class="tracking-step ${isProcessing ? 'completed' : ''}">
                <div class="tracking-step-dot"><i class="bi bi-box"></i></div>
                <div class="small fw-semibold">Tailored & Packed</div>
              </div>
              <div class="tracking-step ${isShipped ? 'completed' : 'current'}">
                <div class="tracking-step-dot"><i class="bi bi-truck"></i></div>
                <div class="small fw-semibold">In Transit</div>
              </div>
              <div class="tracking-step ${isDelivered ? 'completed' : ''}">
                <div class="tracking-step-dot"><i class="bi bi-house-check"></i></div>
                <div class="small fw-semibold">Delivered</div>
              </div>
            </div>

            <!-- Items List -->
            <div class="border-top pt-3 mt-4">
              <h6 class="text-uppercase text-muted fw-bold small mb-3">Shipment Items</h6>
              <div class="d-flex flex-column gap-3">
                ${order.items.map(item => `
                  <div class="d-flex align-items-center justify-content-between">
                    <div class="d-flex align-items-center gap-3">
                      <img src="${item.image_url}" class="rounded" style="width: 55px; height: 70px; object-fit: cover;" alt="${item.product_name}">
                      <div>
                        <div class="fw-semibold small">${item.product_name}</div>
                        <div class="text-muted small">Size: <span class="badge bg-light text-dark border">${item.size}</span> | Color: ${item.color_name} | Qty: ${item.quantity}</div>
                      </div>
                    </div>
                    <div class="fw-bold small">₹${(item.price * item.quantity).toLocaleString()}</div>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Destination Info -->
            <div class="bg-light p-3 rounded-2 mt-4 d-flex flex-wrap justify-content-between align-items-center small text-secondary">
              <div>
                <strong>Shipping To:</strong> ${order.shipping_name}, ${order.shipping_address}, ${order.shipping_city}, ${order.shipping_state} - ${order.shipping_postal_code}
              </div>
              <div class="mt-2 mt-md-0">
                <strong>Tracking:</strong> <span class="font-monospace text-dark">${order.tracking_number || 'TRK-IN-PENDING'}</span>
                <span class="ms-2">Est. Delivery: <strong class="text-dark">${order.estimated_delivery || '3-5 business days'}</strong></span>
              </div>
            </div>

          </div>
        </div>
      `;
    }).join('');

  } catch (err) {
    container.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
  }
}
</script>
{% endblock %}
