{% extends "base.html" %}

{% block content %}
<div class="container py-4" id="cartPageContainer">
  
  <div class="d-flex align-items-baseline gap-2 mb-4 pb-2 border-bottom">
    <h1 class="font-serif fw-bold h2 mb-0">Shopping Bag</h1>
    <span class="text-muted small" id="cartItemsCount"></span>
  </div>

  <div class="row g-5">
    <!-- Cart Items Table -->
    <div class="col-lg-8">
      <div id="cartItemsList">
        <div class="text-center py-5">
          <div class="spinner-border text-dark"></div>
        </div>
      </div>
    </div>

    <!-- Order Summary Card -->
    <div class="col-lg-4" id="cartSummaryContainer" style="display: none;">
      <div class="card border-0 bg-light p-4 rounded-3 sticky-top" style="top: 90px;">
        <h4 class="font-serif fw-bold h5 mb-3">Order Summary</h4>

        <div class="d-flex justify-content-between small text-secondary mb-2">
          <span>Subtotal</span>
          <span id="summarySubtotal" class="text-dark fw-semibold">₹0</span>
        </div>

        <div class="d-flex justify-content-between small text-secondary mb-2">
          <span>Estimated Shipping</span>
          <span id="summaryShipping" class="text-success fw-semibold">FREE</span>
        </div>

        <div class="d-flex justify-content-between small text-secondary mb-3 pb-3 border-bottom">
          <span>Taxes</span>
          <span class="text-dark fw-semibold">Included</span>
        </div>

        <div class="d-flex justify-content-between fw-bold fs-5 mb-4">
          <span>Estimated Total</span>
          <span id="summaryTotal">₹0</span>
        </div>

        <!-- Promo Code Input -->
        <div class="mb-4">
          <label class="form-label small fw-semibold text-light">Promo Code</label>
          <div class="input-group">
            <input type="text" class="form-control" placeholder="e.g. VOGUE10">
            <button class="btn btn-outline-light px-3 fw-semibold" type="button" onclick="showToast('Coupon applied: 10% discount included on checkout!', 'success')">Apply</button>
          </div>
        </div>

        <a href="/checkout" class="btn btn-stitch-primary w-100 py-3 fw-bold d-flex align-items-center justify-content-center gap-2">
          <span>Proceed to Checkout</span>
          <i class="bi bi-arrow-right"></i>
        </a>

        <div class="text-center mt-3">
          <a href="/products" class="small text-secondary text-decoration-none">
            <i class="bi bi-chevron-left me-1"></i> Continue Shopping
          </a>
        </div>
      </div>
    </div>
  </div>

</div>
{% endblock %}
